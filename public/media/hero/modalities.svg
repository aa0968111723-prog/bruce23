<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 720" role="img" aria-label="多模態">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F7FBFF"/>
      <stop offset="1" stop-color="#EAF6FF"/>
    </linearGradient>
    <filter id="s" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="18" stdDeviation="18" flood-color="#17324D" flood-opacity="0.12"/>
    </filter>
  </defs>
  <rect width="1280" height="720" fill="url(#g)"/>
  
  <g font-family="Georgia, serif" font-size="28" fill="#17324D">
    <rect x="80" y="160" width="180" height="180" rx="24" fill="#fff" filter="url(#s)"/>
    <rect x="300" y="160" width="180" height="180" rx="24" fill="#EFFFF7" filter="url(#s)"/>
    <rect x="520" y="160" width="180" height="180" rx="24" fill="#EAF6FF" filter="url(#s)"/>
    <rect x="740" y="160" width="180" height="180" rx="24" fill="#FFF6D8" filter="url(#s)"/>
    <rect x="960" y="160" width="180" height="180" rx="24" fill="#fff" filter="url(#s)"/>
  </g>

</svg>
